<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Alliance Merger Project - Last War</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --accent-hover: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', 'Malgun Gothic', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    /* Selector inicial de idioma */
    .lang-screen {
      max-width: 480px;
      margin: 40px auto;
      text-align: center;
    }

    .lang-screen h1 {
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 10px;
    }

    .lang-screen p {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .lang-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .btn-lang-big {
      padding: 16px;
      background-color: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .btn-lang-big:hover {
      border-color: var(--accent);
      background-color: #172554;
      transform: translateY(-2px);
    }

    /* Barra superior para cambiar idioma rápido */
    .top-lang-bar {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .btn-lang-mini {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--card);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-lang-mini.active {
      border-color: var(--accent);
      color: var(--accent);
      background-color: rgba(245, 158, 11, 0.12);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      padding: 20px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--border);
      border-radius: 14px;
      border-top: 4px solid var(--accent);
    }

    .header h1 {
      font-size: 1.6rem;
      color: var(--accent);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .card {
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .hidden {
      display: none !important;
    }

    /* Botones */
    .btn {
      width: 100%;
      padding: 13px 18px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--accent);
      color: #0f172a;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: #334155;
      color: var(--text);
      margin-bottom: 18px;
      border: 1px solid #475569;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    /* Formulario */
    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Estadísticas rápidas */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-box {
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .stat-box span {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .stat-box strong {
      font-size: 1.3rem;
      color: var(--text);
    }

    /* Tabla */
    .table-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: #4ade80;
      font-weight: 600;
    }

    .dot {
      width: 9px;
      height: 9px;
      background-color: #4ade80;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 560px;
    }

    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.92rem;
    }

    th {
      background-color: #0f172a;
      color: var(--accent);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }

    .rank-cell {
      font-weight: 800;
      color: var(--accent);
      width: 45px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .badge-blanco {
      background-color: rgba(226, 232, 240, 0.2);
      color: #f8fafc;
      border: 1px solid #cbd5e1;
    }

    .badge-azul {
      background-color: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid #3b82f6;
    }

    .badge-morado {
      background-color: rgba(168, 85, 247, 0.2);
      color: #c084fc;
      border: 1px solid #a855f7;
    }

    .btn-small {
      width: auto;
      padding: 8px 14px;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .header h1 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>

      <div class="header">
        <h1 id="txt-titulo"></h1>
        <p id="txt-bienvenida"></p>
      </div>

      <!-- VISTA 1: FORMULARIO DE REGISTRO -->
      <div id="vista-registro" class="card">
        <button type="button" id="btn-ya-registrado" class="btn btn-secondary"></button>

        <h2 id="txt-form-titulo" style="margin-bottom: 14px; font-size: 1.15rem;"></h2>

        <form id="form-registro">
          <div class="form-group">
            <label for="nombre" id="lbl-nombre"></label>
            <input type="text" id="nombre" required>
          </div>

          <div class="form-group">
            <label for="servidor" id="lbl-servidor"></label>
            <input type="text" id="servidor" required>
          </div>

          <div class="form-group">
            <label for="poderHeroe" id="lbl-poderHeroe"></label>
            <input type="number" id="poderHeroe" step="0.01" min="0" required>
            <div class="hint" id="hint-poderHeroe"></div>
          </div>

          <div class="form-group">
            <label for="poderEscuadron" id="lbl-poderEscuadron"></label>
            <input type="number" id="poderEscuadron" step="0.01" min="0" required>
            <div class="hint" id="hint-poderEscuadron"></div>
          </div>

          <div class="form-group">
            <label for="asiento" id="lbl-asiento"></label>
            <select id="asiento" required>
              <option value="" disabled selected id="opt-default"></option>
              <option value="Blanco" id="opt-blanco"></option>
              <option value="Azul" id="opt-azul"></option>
              <option value="Morado" id="opt-morado"></option>
            </select>
          </div>

          <button type="submit" id="btn-enviar" class="btn btn-primary"></button>
        </form>
      </div>

      <!-- VISTA 2: TABLA EN TIEMPO REAL -->

        <div class="table-header-actions">
          <div class="live-badge">

        </div>

          </div>
          <div class="stat-box">

          </div>

                <th id="th-escuadron"></th>
                <th id="th-asiento"></th>
              </tr>
            </thead>
            <tbody id="tabla-cuerpo"></tbody>
          </table>
        </div>
      </div>

        statMorado: "Purple",
        statAzul: "Blue",
        statBlanco: "White",
        thJugador: "Player",
        thServidor: "Server",
        thHeroe: "Hero Power",
        thEscuadron: "Squad 1",
        thAsiento: "Seat",
        cargando: "Loading players from the cloud...",
        vacio: "No players registered yet. Be the first!",
        asientos: { Blanco: "White", Azul: "Blue", Morado: "Purple" }
      }
    };

    let idiomaActual = 'es';
    let datosEnMemoria = null;
    let datosCargados = false;

    // Referencias del DOM
    const vistaIdioma = document.getElementById('vista-idioma');
    const appPrincipal = document.getElementById('app-principal');
    const vistaRegistro = document.getElementById('vista-registro');
    const vistaTabla = document.getElementById('vista-tabla');
    const form = document.getElementById('form-registro');
    const btnYaRegistrado = document.getElementById('btn-ya-registrado');
    const btnVolverRegistro = document.getElementById('btn-volver-registro');
    const btnEnviar = document.getElementById('btn-enviar');
    const tablaCuerpo = document.getElementById('tabla-cuerpo');

    function aplicarIdioma(lang) {
      idiomaActual = lang;
      const t = traducciones[lang];

      document.getElementById('txt-titulo').textContent = t.titulo;
      document.getElementById('txt-bienvenida').textContent = t.bienvenida;
      btnYaRegistrado.textContent = t.yaRegistrado;
      document.getElementById('txt-form-titulo').textContent = t.formTitulo;

      document.getElementById('lbl-nombre').textContent = t.lblNombre;
      document.getElementById('nombre').placeholder = t.phNombre;

      document.getElementById('lbl-servidor').textContent = t.lblServidor;
      document.getElementById('servidor').placeholder = t.phServidor;

      document.getElementById('lbl-poderHeroe').textContent = t.lblPoderHeroe;
      document.getElementById('poderHeroe').placeholder = t.phPoderHeroe;
      document.getElementById('hint-poderHeroe').textContent = t.hintHeroe;

      document.getElementById('lbl-poderEscuadron').textContent = t.lblPoderEscuadron;
      document.getElementById('poderEscuadron').placeholder = t.phPoderEscuadron;
      document.getElementById('hint-poderEscuadron').textContent = t.hintEscuadron;

      document.getElementById('lbl-asiento').textContent = t.lblAsiento;
      document.getElementById('opt-default').textContent = t.optDefault;
      document.getElementById('opt-blanco').textContent = t.optBlanco;
      document.getElementById('opt-azul').textContent = t.optAzul;
      document.getElementById('opt-morado').textContent = t.optMorado;

      if (!btnEnviar.disabled) {
        btnEnviar.textContent = t.btnEnviar;
      }

      document.getElementById('txt-en-vivo').textContent = t.enVivo;
      btnVolverRegistro.textContent = t.volverRegistro;
      document.getElementById('lbl-stat-total').textContent = t.statTotal;
      document.getElementById('lbl-stat-morado').textContent = t.statMorado;
      document.getElementById('lbl-stat-azul').textContent = t.statAzul;
      document.getElementById('lbl-stat-blanco').textContent = t.statBlanco;

      document.getElementById('th-jugador').textContent = t.thJugador;
      document.getElementById('th-servidor').textContent = t.thServidor;
      document.getElementById('th-heroe').textContent = t.thHeroe;
      document.getElementById('th-escuadron').textContent = t.thEscuadron;
      document.getElementById('th-asiento').textContent = t.thAsiento;

      // Marcar botón activo en la barra superior
      document.querySelectorAll('[data-switch-lang]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.switchLang === lang);
      });

      // Re-renderizar la tabla en el idioma elegido
      renderizarTabla();
    }

    // Eventos de los botones de la pantalla inicial de idioma
    document.querySelectorAll('[data-select-lang]').forEach(btn => {
      btn.addEventListener('click', () => {
        aplicarIdioma(btn.dataset.selectLang);
        vistaIdioma.classList.add('hidden');
        appPrincipal.classList.remove('hidden');
      });
    });

    // Eventos de los botones rápidos superiores
    document.querySelectorAll('[data-switch-lang]').forEach(btn => {
      btn.addEventListener('click', () => {
        aplicarIdioma(btn.dataset.switchLang);
      });
    });

    function mostrarTabla() {
      vistaRegistro.classList.add('hidden');
      vistaTabla.classList.remove('hidden');
    }

    function mostrarRegistro() {
      vistaTabla.classList.add('hidden');
      vistaRegistro.classList.remove('hidden');
    }

    btnYaRegistrado.addEventListener('click', mostrarTabla);
    btnVolverRegistro.addEventListener('click', mostrarRegistro);

    function escaparHTML(texto) {
      const div = document.createElement('div');
      div.textContent = texto;
      return div.innerHTML;
    }

    // Enviar datos a Firebase
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const t = traducciones[idiomaActual];

      btnEnviar.disabled = true;
      btnEnviar.textContent = t.guardando;

      const nuevoJugador = {
        nombre: document.getElementById('nombre').value.trim(),
        servidor: document.getElementById('servidor').value.trim(),
        poderHeroe: parseFloat(document.getElementById('poderHeroe').value),
        poderEscuadron: parseFloat(document.getElementById('poderEscuadron').value),
        asiento: document.getElementById('asiento').value,
        fechaRegistro: Date.now()
      };

      try {
        await push(jugadoresRef, nuevoJugador);
        form.reset();
        mostrarTabla();
      } catch (error) {
        console.error("Error al guardar:", error);
        alert(t.errorGuardar);
      } finally {
        btnEnviar.disabled = false;
        btnEnviar.textContent = traducciones[idiomaActual].btnEnviar;
      }
    });

    function renderizarTabla() {
      const t = traducciones[idiomaActual];
      tablaCuerpo.innerHTML = '';

      if (!datosCargados) {
        tablaCuerpo.innerHTML = `
          <tr>
            <td colspan="6" style="text-align:center; color: var(--muted); padding: 20px;">
              ${t.cargando}
            </td>
          </tr>`;
        return;
      }

      if (!datosEnMemoria) {
        tablaCuerpo.innerHTML = `
          <tr>
            <td colspan="6" style="text-align:center; color: var(--muted); padding: 20px;">
              ${t.vacio}
            </td>
          </tr>`;
        actualizarEstadisticas([]);
        return;
      }

      const listaJugadores = Object.values(datosEnMemoria).sort((a, b) => b.poderHeroe - a.poderHeroe);
      actualizarEstadisticas(listaJugadores);

      listaJugadores.forEach((jugador, index) => {
        const claseBadge = `badge-${jugador.asiento.toLowerCase()}`;
        const textoAsiento = t.asientos[jugador.asiento] || jugador.asiento;
        const fila = document.createElement('tr');
        fila.innerHTML = `
          <td class="rank-cell">#${index + 1}</td>
          <td><strong>${escaparHTML(jugador.nombre)}</strong></td>
          <td>${escaparHTML(jugador.servidor)}</td>
          <td><strong>${Number(jugador.poderHeroe).toFixed(2)} M</strong></td>
          <td>${Number(jugador.poderEscuadron).toFixed(2)} M</td>
          <td><span class="badge ${claseBadge}">${escaparHTML(textoAsiento)}</span></td>
        `;
        tablaCuerpo.appendChild(fila);
      });
    }

    function actualizarEstadisticas(lista) {
      document.getElementById('stat-total').textContent = lista.length;
      document.getElementById('stat-morado').textContent = lista.filter(j => j.asiento === 'Morado').length;
      document.getElementById('stat-azul').textContent = lista.filter(j => j.asiento === 'Azul').length;
      document.getElementById('stat-blanco').textContent = lista.filter(j => j.asiento === 'Blanco').length;
    }

    // Escuchar cambios en tiempo real desde Firebase
    onValue(jugadoresRef, (snapshot) => {
      datosEnMemoria = snapshot.val();
      datosCargados = true;
      renderizarTabla();
    });
  </script>
</body>
</html>
